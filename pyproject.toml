# Settings for the tools we use: black (format), ruff (lint), pytest (tests).

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# C417 says "do not use map()". The task asks us to use map/filter/reduce,
# so we turn this one rule off.
ignore = ["C417"]

[tool.pytest.ini_options]
# Lets the tests import the "core" folder.
pythonpath = ["."]
